<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feather Finder | Result</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #eef2fb 0%, #f8fafc 100%);
            color: #2d3a4b;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 520px;
            margin: 70px auto;
            background-color: #ffffff;
            padding: 34px 36px;
            border-radius: 24px;
            box-shadow: 0 18px 50px rgba(45, 58, 75, 0.12);
            text-align: center;
        }
        h2 {
            color: #1f304f;
            margin-bottom: 20px;
            font-size: 2rem;
        }
        .result-card {
            background: #f7fbff;
            border: 1px solid #dbe8ff;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 28px;
        }
        .result-card strong {
            display: block;
            margin-top: 12px;
            color: #1f304f;
            font-size: 1.5rem;
        }
        .confidence {
            font-size: 16px;
            color: #556575;
            margin-top: 12px;
        }
        .button {
            display: inline-block;
            padding: 14px 26px;
            background-color: #3272d9;
            color: #ffffff;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 700;
            transition: background-color 0.2s ease;
        }
        .button:hover {
            background-color: #2d65c8;
        }
        @media (max-width: 560px) {
            .container {
                margin: 40px 18px;
                padding: 24px 20px;
            }
            h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Prediction Result</h2>
        <div class="result-card">
            <div>Bird species predicted:</div>
            <strong>{{ result['class'] }}</strong>
            <div class="confidence">Confidence: {{ '{:.2f}'.format(result['confidence'] * 100) }}%</div>
        </div>
        <a href="/" class="button">Classify Another Image</a>
    </div>
</body>
</html>
